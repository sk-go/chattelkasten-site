<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect x="4" y="4" width="120" height="120" fill="#111111" stroke="#e9e9e6" stroke-width="4"/>
  <!-- Architectural grid cross -->
  <line x1="64" y1="12" x2="64" y2="116" stroke="#2d2d2a" stroke-width="2"/>
  <line x1="12" y1="64" x2="116" y2="64" stroke="#2d2d2a" stroke-width="2"/>
  <!-- Overlapping brutalist hyperedge frames -->
  <rect x="20" y="22" width="54" height="54" stroke="#e9e9e6" stroke-width="3.5"/>
  <rect x="54" y="48" width="54" height="54" stroke="#e9e9e6" stroke-width="3.5" stroke-dasharray="8 5"/>
  <!-- Tension diagonal in vermilion -->
  <line x1="36" y1="40" x2="92" y2="86" stroke="#ff4a1c" stroke-width="4"/>
  <!-- Nodes -->
  <rect x="30" y="34" width="12" height="12" fill="#e9e9e6"/>
  <rect x="86" y="80" width="12" height="12" fill="#e9e9e6"/>
  <rect x="57" y="56" width="14" height="14" fill="#ff4a1c"/>
</svg>
